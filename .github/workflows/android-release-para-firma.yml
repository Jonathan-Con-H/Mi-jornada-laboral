name: Mi Jornada - compilar APK release para firma privada
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-release-para-firma.yml
      - tests/documentos.test.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Preparar herramientas
        run: |
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
      - name: Copiar interfaz y asistente
        run: |
          cp dashboard.css dashboard.js mi-jornada-assistant.js mi-jornada-gemini.js firebase-web-config.js app/src/main/assets/
          node --check app/src/main/assets/mi-jornada-documents.js
          node --test tests/android.test.js tests/documentos.test.cjs
      - name: Compilar release sin firma
        run: ./gradle-8.7/bin/gradle --no-daemon assembleRelease
      - name: Guardar APK para firmar fuera de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Jornada-2.1-RELEASE-SIN-FIRMA
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

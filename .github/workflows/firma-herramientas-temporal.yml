name: Herramientas temporales para firmar Mi Jornada fuera de GitHub
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/firma-herramientas-temporal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  herramientas:
    runs-on: ubuntu-latest
    steps:
      - name: Empaquetar herramientas públicas del SDK Android
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/android-herramientas-firma.tar.gz -C "$ANDROID_HOME/build-tools/35.0.0" zipalign lib/apksigner.jar
      - name: Guardar herramientas públicas
        uses: actions/upload-artifact@v4
        with:
          name: android-herramientas-firma-temporales
          path: /tmp/android-herramientas-firma.tar.gz
          if-no-files-found: error
          retention-days: 1

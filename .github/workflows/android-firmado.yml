name: Mi Jornada - APK Android firmado

# Una vez configurada una misma clave privada, las siguientes versiones firmadas
# con ella se pueden actualizar sin desinstalar la aplicación ni borrar sus datos.
# No usar la clave de depuración efímera de los runners de GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-firmado:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Comprobar que existe la clave privada de firma
        env:
          MJ_RELEASE_BUNDLE_B64: ${{ secrets.MJ_RELEASE_BUNDLE_B64 }}
        shell: bash
        run: |
          if [ -z "${MJ_RELEASE_BUNDLE_B64:-}" ]; then
            echo "::error title=Firma no configurada::Falta el secreto MJ_RELEASE_BUNDLE_B64. No se publicará ningún APK sin firma estable."
            exit 1
          fi
      - name: Instalar Gradle 8.7
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Compilar APK de distribución
        shell: bash
        run: ./gradle-8.7/bin/gradle --no-daemon assembleRelease

      - name: Firmar y verificar APK
        env:
          MJ_RELEASE_BUNDLE_B64: ${{ secrets.MJ_RELEASE_BUNDLE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$RUNNER_TEMP/mijornada-release.jks"
          SECRET_JSON="$(mktemp "$RUNNER_TEMP/mj-signing.XXXXXXXX")"
          trap 'rm -f "$KEYSTORE" "$SECRET_JSON"' EXIT
          printf '%s' "$MJ_RELEASE_BUNDLE_B64" | base64 --decode > "$SECRET_JSON"
          jq -e '.keystore_b64 | type == "string"' "$SECRET_JSON" >/dev/null
          jq -e '.store_password | type == "string"' "$SECRET_JSON" >/dev/null
          jq -e '.key_alias | type == "string"' "$SECRET_JSON" >/dev/null
          jq -e '.key_password | type == "string"' "$SECRET_JSON" >/dev/null
          jq -r '.keystore_b64' "$SECRET_JSON" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          export MJ_RELEASE_STORE_PASSWORD="$(jq -r '.store_password' "$SECRET_JSON")"
          export MJ_RELEASE_KEY_ALIAS="$(jq -r '.key_alias' "$SECRET_JSON")"
          export MJ_RELEASE_KEY_PASSWORD="$(jq -r '.key_password' "$SECRET_JSON")"
          for value in MJ_RELEASE_STORE_PASSWORD MJ_RELEASE_KEY_ALIAS MJ_RELEASE_KEY_PASSWORD; do
            if [ -z "${!value}" ]; then echo '::error::Falta un dato de firma.'; exit 1; fi
          done
          echo "::add-mask::$MJ_RELEASE_STORE_PASSWORD"
          echo "::add-mask::$MJ_RELEASE_KEY_PASSWORD"
          SDK_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          INPUT_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$INPUT_APK"
          "$SDK_TOOLS/zipalign" -f -p 4 "$INPUT_APK" "$RUNNER_TEMP/mijornada-aligned.apk"
          "$SDK_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$MJ_RELEASE_KEY_ALIAS" \
            --ks-pass env:MJ_RELEASE_STORE_PASSWORD \
            --key-pass env:MJ_RELEASE_KEY_PASSWORD \
            --out "$RUNNER_TEMP/Mi-Jornada-Firmado.apk" \
            "$RUNNER_TEMP/mijornada-aligned.apk"
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs \
            --min-sdk-version 24 "$RUNNER_TEMP/Mi-Jornada-Firmado.apk"
          sha256sum "$RUNNER_TEMP/Mi-Jornada-Firmado.apk"
      - name: Guardar solo APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Jornada-APK-FIRMADO
          path: ${{ runner.temp }}/Mi-Jornada-Firmado.apk
          if-no-files-found: error
          retention-days: 30

      - name: Eliminar clave temporal de la máquina de compilación
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mijornada-release.jks"

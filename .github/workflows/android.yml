
name: Compilar APK Android de pruebas (NO instalar como actualización)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar Gradle 8.7
        run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Compilar APK
        run: ./gradle-8.7/bin/gradle assembleDebug

      # Este APK se firma con la clave efímera del runner. No se debe ofrecer
      # como actualización segura de una aplicación Android ya instalada.
      - name: Guardar APK DE PRUEBAS (firma temporal)
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Jornada-APK-DEPURACION-NO-ACTUALIZAR
          path: app/build/outputs/apk/debug/app-debug.apk

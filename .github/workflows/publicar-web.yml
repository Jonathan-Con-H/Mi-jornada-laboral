name: Mi Jornada web (flujo antiguo, manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar Mi Jornada
        uses: actions/checkout@v4
      - name: Preparar solo los archivos web
        run: |
          mkdir -p _site
          cp index.html dashboard.css dashboard.js sw.js _site/
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest _site/; fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Publicar Mi Jornada
        id: deployment
        uses: actions/deploy-pages@v4

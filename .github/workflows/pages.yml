name: Publicar Mi Jornada en la web

# La publicación automática la realiza GitHub Pages desde la rama main.
# Este flujo se mantiene solo para una publicación manual excepcional.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar web
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js dashboard.css dashboard.js _site/
          touch _site/.nojekyll

      - name: Subir web
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

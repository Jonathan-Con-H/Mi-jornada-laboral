plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    // Conservar el mismo comportamiento Android de la versión instalada.
    // La versión 1.8 es de distribución manual; no se publica en Google Play.
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
    namespace 'es.mijornada.app'
    compileSdk 35

    defaultConfig {
        applicationId 'es.mijornada.app'
        minSdk 24
        targetSdk 28
        versionCode 9
        versionName '1.8'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
